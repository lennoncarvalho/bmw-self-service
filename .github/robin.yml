# reasoning-effort: high   # unset: no reasoning control is sent, the provider/model decides. Set a value (low, medium, high, …) to send it, or "off" to be explicit
agent-mode: auto   # unset: single-shot diff review. Set auto for the multi-turn review that reads the repo with tools
agent-max-turns: 100   # max allowed; tool-calling turns before the final review is requested
agent-max-diff-size: 200000   # default; diff characters sent up front in agent mode
max-diff-size: 200000   # single-shot fallback; keep model context manageable for reasoning models
