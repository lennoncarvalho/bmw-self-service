name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "ui/**"
      - "tests/**"
      - "assets/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/python-ci.yml"

  pull_request:
    paths:
      - "app/**"
      - "ui/**"
      - "tests/**"
      - "assets/**"
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/python-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-cov pytest-timeout pip-audit

      - name: Ruff lint
        run: ruff check app/ ui/ tests/ main.py

      - name: Ruff format check
        run: ruff format --check app/ ui/ tests/ main.py

      - name: Mypy type check
        run: mypy app/ ui/ --ignore-missing-imports

      - name: Tests with coverage
        run: pytest tests/ -v --cov=app --cov=ui --cov-report=term --timeout=60

      - name: Security audit
        run: pip-audit
