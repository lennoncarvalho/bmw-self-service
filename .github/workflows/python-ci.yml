name: CI

on:
  push:
    branches: ["main"]
    paths:
      - "app/**"
      - "ui/**"
      - "assets/**"
      - "main.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "scripts/**"
      - ".github/workflows/python-ci.yml"

  pull_request:
    paths:
      - "app/**"
      - "ui/**"
      - "assets/**"
      - "main.py"
      - "requirements.txt"
      - "pyproject.toml"
      - "scripts/**"
      - ".github/workflows/python-ci.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pip-audit

      - name: Ruff lint
        run: ruff check app/ ui/ main.py

      - name: Ruff format check
        run: ruff format --check app/ ui/ main.py

      - name: Mypy type check
        run: mypy app/ ui/ main.py --ignore-missing-imports

      - name: Security audit
        run: pip-audit
